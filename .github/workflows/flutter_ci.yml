name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform wrapper when missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name dataquest_analyst_career --org com.dataquest .
          fi

      - name: Configure Android local notifications
        run: dart run tool/configure_android_notifications.dart

      - name: Install SQLite test library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          flutter build apk --debug || {
            echo 'Retrying Android build after a transient Gradle dependency failure'
            sleep 12
            flutter build apk --debug
          }

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Build release split APKs
        run: flutter build apk --release --split-per-abi

      - name: Check release budgets
        run: dart run tool/check_release_budgets.dart

      - name: Report artifact sizes
        run: |
          echo "## Android artifact sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Debug APK: $(du -h build/app/outputs/flutter-apk/app-debug.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release AAB: $(du -h build/app/outputs/bundle/release/app-release.aab | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ARM32 release APK: $(du -h build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ARM64 release APK: $(du -h build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- x86_64 release APK: $(du -h build/app/outputs/flutter-apk/app-x86_64-release.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dataquest-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: dataquest-android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload release split APKs
        uses: actions/upload-artifact@v4
        with:
          name: dataquest-android-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
