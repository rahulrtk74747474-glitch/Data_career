name: dataquest_analyst_career
description: Offline-first data analyst career simulation game.
publish_to: "none"
version: 1.1.0+12

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cross_file: ^0.3.5+5
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^2.6.1
  file_picker: ^13.1.0
  flutter_timezone: ^5.1.0
  http: ^1.2.2
  open_file: ^4.0.0
  path: ^1.9.1
  pdf: ^3.13.1
  shared_preferences: ^2.3.3
  share_plus: ^13.3.1
  sqflite: ^2.4.4
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/content/
