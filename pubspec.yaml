version: 0.7.0+7

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^2.6.1
  flutter_timezone: ^5.1.0
